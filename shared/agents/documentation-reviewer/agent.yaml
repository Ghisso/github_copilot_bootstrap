{
  "id": "documentation-reviewer",
  "description": "Reviews documentation quality including Google-style docstrings, README completeness, docs/ organization, and documentation-code synchronization. Use after implementation changes to ensure docs are accurate and helpful for users and developers.",
  "role_type": "reviewer",
  "visibility": "public",
  "capabilities": [
    "delegate",
    "read",
    "search"
  ],
  "delegates": [
    "review-pass-codex",
    "review-pass-sonnet"
  ],
  "model_intent": {
    "github-copilot": "target-default",
    "claude-code": "target-native",
    "openai-codex": "target-native"
  },
  "targets": {
    "github-copilot": "targets/github-copilot.md",
    "claude-code": "targets/claude-code.md",
    "openai-codex": "targets/openai-codex.md"
  }
}
