{
  "id": "security-reviewer",
  "description": "Reviews code for security vulnerabilities. Checks OWASP Top 10 adapted for Python AI projects: hardcoded secrets, injection risks, unsafe deserialization, SQL injection, path traversal, and dependency security. Use before any PR or deployment.",
  "role_type": "reviewer",
  "visibility": "public",
  "capabilities": [
    "delegate",
    "read",
    "search"
  ],
  "delegates": [
    "review-pass-codex",
    "review-pass-sonnet"
  ],
  "model_intent": {
    "github-copilot": "target-default",
    "claude-code": "target-native",
    "openai-codex": "target-native"
  },
  "targets": {
    "github-copilot": "targets/github-copilot.md",
    "claude-code": "targets/claude-code.md",
    "openai-codex": "targets/openai-codex.md"
  }
}
