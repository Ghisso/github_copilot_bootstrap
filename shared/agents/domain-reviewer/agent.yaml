{
  "id": "domain-reviewer",
  "description": "Customizable review agent for project-specific domain concerns. Adapt for your domain: NLP, computer vision, RAG systems, data pipelines, etc. Use for domain-specific correctness and best practices checks.",
  "role_type": "reviewer",
  "visibility": "public",
  "capabilities": [
    "delegate",
    "read",
    "search"
  ],
  "delegates": [
    "review-pass-codex",
    "review-pass-sonnet"
  ],
  "model_intent": {
    "github-copilot": "target-default",
    "claude-code": "target-native",
    "openai-codex": "target-native"
  },
  "targets": {
    "github-copilot": "targets/github-copilot.md",
    "claude-code": "targets/claude-code.md",
    "openai-codex": "targets/openai-codex.md"
  }
}
