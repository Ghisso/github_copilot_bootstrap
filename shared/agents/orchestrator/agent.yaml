{
  "id": "orchestrator",
  "description": "Main-thread workflow orchestrator for complex implementation tasks. Delegates planning, coding, review, and verification to specialists, and owns the lifecycle ceremony (branch, commit, PR, memory, and session-log writes) itself. Not itself a delegatable subagent.",
  "role_type": "orchestrator",
  "visibility": "public",
  "capabilities": [
    "delegate",
    "edit",
    "execute",
    "read",
    "search",
    "todo"
  ],
  "delegates": [
    "planner",
    "coder",
    "reviewer",
    "documenter"
  ],
  "model_intent": {
    "github-copilot": "target-default",
    "claude-code": { "model": "inherit", "effort": "inherit" },
    "openai-codex": { "model": "gpt-5.6-sol", "effort": "xhigh" },
    "google-antigravity": { "model": "pro" }
  }
}
