[features.multi_agent_v2]
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[mcp_servers.semble]
command = "uvx"
args = ["--from", "semble[mcp]", "semble"]

[mcp_servers.context-mode]
command = "bash"
args = ["-c", "REPO_ROOT=\"${CLAUDE_PROJECT_DIR:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}\"; exec \"$REPO_ROOT/.claude/hooks/scripts/context-mode-dispatch.sh\" server"]
