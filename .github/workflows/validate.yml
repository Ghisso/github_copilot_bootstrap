name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Regenerate targets
        run: uv run python scripts/generate_targets.py --all

      - name: Validate targets
        run: uv run python scripts/validate_targets.py
