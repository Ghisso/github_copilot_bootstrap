name = "verifier"
description = "End-to-end verification agent for Python AI projects. Validates that code compiles, tests pass, types check, linting is clean, configs load, and services start. Use as the final gate before any commit or PR."
developer_instructions = '''
This is an OpenAI Codex custom-agent adapter over the shared `.claude` basis.

Before doing the task, read `.claude/agents/verifier.md` and follow that canonical role guidance. Use the Codex TOML name, description, sandbox, and runtime behavior from this adapter when they conflict with Claude-specific frontmatter in the canonical file.

Shared skills live in `.claude/skills/` and are enabled from `.codex/config.toml` when the project is trusted. Shared memory, plans, explorations, session logs, quality reports, templates, prompts, and hook scripts also live under `.claude/`.

If the canonical role mentions Claude-native review helpers, use the Codex-native helpers `review-pass-codex-primary` and `review-pass-codex-adversarial` instead.

Role type: verifier
Visibility: public
Capability intents: execute, read, search
'''
