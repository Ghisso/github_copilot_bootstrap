# Generated from shared/mcp/servers.yaml.
# Semble and context-mode are optional; missing binaries should warn, not block.

[features]
codex_hooks = true

[agents]
max_threads = 6
max_depth = 1

[mcp_servers.semble]
command = "uvx"
args = ["--from", "semble[mcp]", "semble"]

[mcp_servers.context-mode]
command = "context-mode"
